[package]
name = "carciniscript"
version = "0.1.0"
edition = "2024"

[dependencies]
js-sys = "0.3.107"
ra_ap_syntax = "=0.0.362"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
